name: 시장·뉴스 데이터 수집

# 축산 수급현황(KAPE)과 축산·식품·육가공 뉴스를 모아 data/*.json 으로 저장합니다.
# 대시보드는 이 파일을 읽습니다. (Actions 탭 → 이 워크플로 → Run workflow 로 바로 실행 가능)
on:
  schedule:
    - cron: '10 */3 * * *'   # 3시간마다 (UTC 기준, 한국시간 09:10·12:10·15:10 …)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/collect_market.py'
      - '.github/workflows/collect-market.yml'

permissions:
  contents: write

concurrency:
  group: collect-market
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: 수집
        env:
          # 네이버 뉴스 API 키를 저장소 Secrets에 넣으면 요약문이 있는 네이버 뉴스로 바뀝니다 (없으면 구글 뉴스)
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python3 scripts/collect_market.py

      - name: 변경분 커밋
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "시장·뉴스 데이터 갱신"
            git pull --rebase
            git push
          fi
